repository_type: pipeline

nf_core_version: 4.0.2

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-na12878-variant-calling_logo_light.png
    - docs/images/nf-core-na12878-variant-calling_logo_light.png
    - docs/images/nf-core-na12878-variant-calling_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-na12878-variant-calling_logo_light.png
    - docs/images/nf-core-na12878-variant-calling_logo_light.png
    - docs/images/nf-core-na12878-variant-calling_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: nesirli
  name: na12878-variant-calling
  description: End-to-end reproducible workflow for calling, filtering, and annotating
    clinical genomic variants.
  author: nasir
  version: 1.0.0
  force: true
  outdir: scaffold
  is_nfcore: false
