# Sample
sample:
  id: 'ERR194147'
  # ENA mirrors the same run as pre-gzipped FASTQ, so reads can be fetched
  # directly instead of downloading the SRA and expanding it (~400 GB).
  ena-url: "https://ftp.sra.ebi.ac.uk/vol1/fastq/ERR194/ERR194147"
  ena-md5:
    r1: "63634f9d0736e09debdfe5827a5e82a0"
    r2: "81c3ba5eb6da709324cd124a847b4528"
    orphan: "b708805624448ab8f1404a56169c0024"

# Directories
directories:
  raw: "data/raw"
  reference: "data/reference"
  qc: "results/qc"
  align: "results/align"
  analysis: "results/analysis"
  annotation: "results/annotation"
  validation: "results/validation"

# Parameters
params:
  download-threads: 4
  qc-threads: 4          # fastqc only; multiqc is single-threaded
  bwa-threads: 4         # bwa mem threads; bwa + sort run together as one pipe group
  sort-threads: 4        # bwa + sort run concurrently = 8 total; raised after QC stage finished
  sort-mem-mb: 512       # per sort thread; lowered from 1024 to cut peak RAM (2 threads x 512M)
  variant-interval: "20" # HaplotypeCaller -L interval; empty string = whole genome

# Annotation database
snpeff:
  database: "GRCh38.105"
  data-dir: "results/annotation/snpeff_data"

# GIAB validation truth set (NA12878 / HG001, GRCh38)
truth:
  dir: "data/reference/truth"
  filename: "HG001_GRCh38_1_22_v4.2.1_benchmark.vcf.gz"
  url: "https://ftp-trace.ncbi.nlm.nih.gov/giab/ftp/release/NA12878_HG001/latest/GRCh38"
